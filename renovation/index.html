<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>עלויות השיפוץ</title>
<!-- ההתקנה דרך האפליקציה הראשית -->
<meta name="theme-color" content="#2f6f62">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --fg:#1d2624; --muted:#62716d; --line:#d8dfdc;
  --accent:#2f6f62; --accent-ink:#ffffff; --danger:#b3412f; --exp:#9a6a12; --exp-bg:#fbf4e4;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a19; --card:#1c2422; --fg:#e7eeec; --muted:#93a39f; --line:#2c3633;
  --accent:#5fb3a1; --accent-ink:#0f1513; --danger:#e07a68; --exp:#e0b45c; --exp-bg:#2a2416; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px}
h1{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--muted);font-weight:500}
.total{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.95rem}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box .l{font-size:.85rem;color:var(--muted)}
.box .v{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.box.e{background:var(--exp-bg);border-color:var(--exp)} .box.e .v{color:var(--exp)}
h2{font-family:var(--display);font-size:1rem;font-weight:500;margin:0 0 8px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
.kind{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kind button{border:0;background:var(--bg);color:var(--muted);padding:10px;font-weight:600}
.kind button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kind button.ex[aria-pressed="true"]{background:var(--exp);color:#fff}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.add{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;font-weight:600;font-size:1rem}
.add.ex{background:var(--exp);color:#fff}
.add.sec{background:none;color:var(--accent);border:1px solid var(--accent)}
.add:disabled{opacity:.6}
.msg{grid-column:1/-1;font-size:.9rem;color:var(--muted);min-height:1.2em}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);font-variant-numeric:tabular-nums}
.chip b{font-weight:600} .chip i{font-style:normal;color:var(--exp);font-size:.9em}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.acts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
li.pp,li.ed{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--exp-bg);padding:10px;border-radius:8px}
li.ed{background:var(--card)}
li.pp input{width:8em;flex:0 0 auto}
li.ed label{flex:1 1 9em}
.ppok,.edok{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.ppno,.edno{background:none;border:0;color:var(--muted);padding:10px 6px}
li.grp{cursor:pointer}
li.grp .n b{font-weight:600}
.cnt{color:var(--muted);font-size:.85rem}
li.sub{padding-inline-start:16px;border-bottom-style:dashed}
#elist .a{color:var(--exp)}
.d{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:3.2em}
.n{min-width:0;overflow-wrap:anywhere}
.a{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.del,.pay,.part,.edit{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:5px 10px;font-size:.85rem}
.pay{color:var(--accent);font-weight:600}
.part{color:var(--exp);font-weight:600}
.del.arm,.pay.arm{color:var(--danger);border-color:var(--danger);font-weight:600}
.empty{color:var(--muted);padding:12px 0;display:block}
.out{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;justify-self:start;padding:0}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--display);font-weight:500;color:var(--muted);font-size:.9rem;background:var(--bg)}
.tbl td.m,.tbl th.m{text-align:left;white-space:nowrap}
.tbl tr.sup{cursor:pointer}
.tbl tr.sup td:first-child{font-weight:600}
.tbl .ok{color:var(--accent);font-weight:600}
.tbl .left{color:var(--exp);font-weight:600}
.tbl .q{color:var(--muted)}
.tbl tr.det td{background:var(--bg);font-size:.88rem;color:var(--muted);padding:6px 12px 6px 12px}
.tbl tr.det td:first-child{padding-inline-start:26px}
.tbl tfoot td{font-family:var(--display);font-weight:700;border-bottom:0;background:var(--bg)}
.tbl .pbtn{display:inline-block;margin-inline-start:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:4px 10px;font-size:.85rem;font-weight:600}
.tbl tr.payrow td{background:var(--exp-bg)}
.payf{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.payf label{flex:1 1 7em}
.payf .ok2{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.payf .no2{background:none;border:0;color:var(--muted);padding:10px 6px}
.payf .nt{flex-basis:100%;font-size:.85rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
@media (max-width:420px){form{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- כניסה -->
<div class="wrap" id="loginView" hidden>
  <a href="/" style="display:inline-block;margin-bottom:8px;color:#2f6f62;font-weight:600;text-decoration:none">→ לתפריט האפליקציות</a>
  <h1>עלויות השיפוץ – כניסה</h1>
  <form id="lf" autocomplete="on">
    <label class="full">דואר אלקטרוני<input id="email" type="email" required autocomplete="email"></label>
    <label class="full">סיסמה<input id="pass" type="password" required minlength="6" autocomplete="current-password"></label>
    <button class="add" type="submit" id="loginBtn">כניסה</button>
    <button class="add sec" type="button" id="signupBtn">פתיחת משתמש חדש</button>
    <button class="out" type="button" id="forgotBtn">שכחתי סיסמה</button>
    <div class="msg" id="lmsg" aria-live="polite"></div>
  </form>
</div>

<!-- סיסמה חדשה -->
<div class="wrap" id="resetView" hidden>
  <h1>בחירת סיסמה חדשה</h1>
  <form id="rf" autocomplete="on">
    <label class="full">סיסמה חדשה (לפחות 6 תווים)<input id="newpass" type="password" required minlength="6" autocomplete="new-password"></label>
    <button class="add" type="submit">שמירת הסיסמה</button>
    <div class="msg" id="rmsg" aria-live="polite"></div>
  </form>
</div>

<!-- האפליקציה -->
<div class="wrap" id="appView" hidden>
  <a href="/" style="display:inline-block;margin-bottom:8px;color:#2f6f62;font-weight:600;text-decoration:none">→ לתפריט האפליקציות</a>
  <header>
    <h1>עלויות השיפוץ – שולם עד היום</h1>
    <div class="total" id="total">…</div>
    <div class="sub" id="count"></div>
    <div class="fc">
      <div class="box e"><div class="l">צפוי לשלם עוד</div><div class="v" id="etotal">…</div></div>
      <div class="box"><div class="l">צפי סך הכול לשיפוץ</div><div class="v" id="ftotal">…</div></div>
    </div>
  </header>
  <section><h2>לפי ספק</h2>
    <table class="tbl"><thead><tr><th>למי</th><th class="m">שולם</th><th class="m">נשאר</th></tr></thead><tbody id="stbl"></tbody><tfoot id="sfoot"></tfoot></table>
    <div class="hint">לחיצה על שורה מראה את התשלומים שלה</div>
  </section>
  <h2 style="margin-bottom:-12px">הוספת תשלום</h2>
  <form id="f" autocomplete="off">
    <div class="kind" role="group" aria-label="סוג">
      <button type="button" id="kpaid" aria-pressed="true">שולם</button>
      <button type="button" id="kexp" class="ex" aria-pressed="false">צפוי לשלם</button>
    </div>
    <label class="full">למי / על מה<input id="who" required placeholder="למשל: סאלח, קרמיקה טורעאן"></label>
    <label>סכום (₪)<input id="amt" inputmode="numeric" placeholder="0"></label>
    <label><span id="dlabel">תאריך</span><input id="date" type="date"></label>
    <button class="add" id="addbtn" type="submit">הוסף תשלום</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>
  <section><h2>צפוי לשלם</h2><ul id="elist"></ul></section>
  <section><h2>כל התשלומים ששולמו</h2><ul id="list"></ul></section>
  <button class="out" id="logout" type="button">יציאה מהמשתמש</button>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var db = supabase.createClient(window.APP_CONFIG.url, window.APP_CONFIG.key);
  var T = 'renovation_payments';
  var rows = [], busy = false, armed = null, kind = 'paid', partId = null, editId = null, openG = {}, openS = {}, payS = null;
  var $ = function(id){return document.getElementById(id)};
  var fmt = function(n){return Number(n||0).toLocaleString('he-IL') + ' ₪'};
  var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var shortDate = function(d){if(!d) return '—'; var p=d.split('-');return (+p[2])+'.'+(+p[1])};
  function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}

  /* ---------- כניסה ---------- */
  var recovering = false;
  function show(view){ $('loginView').hidden = view!=='login'; $('appView').hidden = view!=='app'; $('resetView').hidden = view!=='reset'; }
  $('forgotBtn').addEventListener('click', function(){
    var em = $('email').value.trim();
    if(!em){ $('lmsg').textContent = 'הקלד קודם את הדואר שלך בשדה למעלה, ואז לחץ שוב על "שכחתי סיסמה".'; return; }
    $('lmsg').textContent = 'שולח…';
    db.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname}).then(function(r){
      $('lmsg').textContent = r.error ? 'השליחה נכשלה: ' + r.error.message : 'נשלח אליך מייל. לחץ על הקישור שבו ובחר סיסמה חדשה.';
    });
  });
  $('rf').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = $('newpass').value;
    if(pw.length < 6){ $('rmsg').textContent = 'הסיסמה צריכה לפחות 6 תווים.'; return; }
    $('rmsg').textContent = 'שומר…';
    db.auth.updateUser({password: pw}).then(function(r){
      if(r.error){ $('rmsg').textContent = 'השמירה נכשלה: ' + r.error.message; return; }
      recovering = false; $('rmsg').textContent = 'הסיסמה עודכנה.'; show('app'); load();
    });
  });
  $('lf').addEventListener('submit', function(e){
    e.preventDefault(); $('lmsg').textContent = 'נכנס…';
    db.auth.signInWithPassword({email:$('email').value.trim(), password:$('pass').value}).then(function(r){
      if(r.error) $('lmsg').textContent = 'הכניסה נכשלה: בדוק דואר וסיסמה.';
    });
  });
  $('signupBtn').addEventListener('click', function(){
    var em = $('email').value.trim(), pw = $('pass').value;
    if(!em || pw.length < 6){ $('lmsg').textContent = 'מלא דואר וסיסמה (לפחות 6 תווים).'; return; }
    $('lmsg').textContent = 'פותח משתמש…';
    db.auth.signUp({email:em, password:pw, options:{emailRedirectTo: location.origin + location.pathname}}).then(function(r){
      if(r.error) $('lmsg').textContent = 'לא הצלחתי לפתוח משתמש: ' + r.error.message;
      else if(!r.data.session) $('lmsg').textContent = 'נשלח אליך מייל אישור. לחץ על הקישור שבו ואז היכנס כאן.';
    });
  });
  $('logout').addEventListener('click', function(){ db.auth.signOut(); });
  db.auth.onAuthStateChange(function(ev, session){
    if(ev === 'PASSWORD_RECOVERY'){ recovering = true; show('reset'); return; }
    if(recovering) return;
    if(session){ show('app'); load(); } else { show('login'); }
  });

  /* ---------- נתונים ---------- */
  function load(){
    db.from(T).select('id,d,who,amt,exp').order('id').then(function(r){
      if(r.error){ $('msg').textContent = 'טעינה נכשלה. נסה לרענן.'; return; }
      rows = r.data; render();
    });
  }
  function done(r, text){
    busy = false; $('addbtn').disabled = false;
    if(r.error){ $('msg').textContent = 'השמירה נכשלה. נסה שוב.'; load(); }
    else { $('msg').textContent = text; }
  }

  function setKind(k){
    kind = k;
    $('kpaid').setAttribute('aria-pressed', k==='paid');
    $('kexp').setAttribute('aria-pressed', k==='exp');
    $('addbtn').textContent = k==='exp' ? 'הוסף לצפי' : 'הוסף תשלום';
    $('addbtn').className = 'add' + (k==='exp' ? ' ex' : '');
    $('dlabel').textContent = k==='exp' ? 'מתי בערך (לא חובה)' : 'תאריך';
    $('date').value = k==='exp' ? '' : today();
  }
  $('kpaid').addEventListener('click', function(){setKind('paid')});
  $('kexp').addEventListener('click', function(){setKind('exp')});
  $('date').value = today();

  function btn(cls, id, label, armLabel){
    var key = cls + id;
    return '<button class="'+cls+(armed===key?' arm':'')+'" data-k="'+key+'" data-id="'+id+'" type="button">'+(armed===key?armLabel:label)+'</button>';
  }

  function render(){
    var paid = rows.filter(function(r){return !r.exp});
    var exp = rows.filter(function(r){return r.exp});
    var pt = paid.reduce(function(s,r){return s+r.amt},0);
    var et = exp.reduce(function(s,r){return s+r.amt},0);
    $('total').textContent = fmt(pt);
    $('etotal').textContent = fmt(et);
    $('ftotal').textContent = fmt(pt+et);
    var unk = exp.filter(function(r){return !r.amt}).length;
    $('count').textContent = paid.length + ' תשלומים · ' + exp.length + ' צפויים' + (unk ? ' (' + unk + ' מהם בלי סכום – לא נכללים בצפי)' : '');
    /* טבלה לפי ספק */
    var key = skey;
    var S = {}, so = [];
    rows.forEach(function(r){ var k = key(r.who); if(!S[k]){ S[k]={p:0,e:0,unk:false,list:[]}; so.push(k); }
      var o=S[k]; o.list.push(r); if(r.exp){ o.e+=r.amt; if(!r.amt) o.unk=true; } else o.p+=r.amt; });
    so.sort(function(a,b){ return (S[b].p+S[b].e)-(S[a].p+S[a].e); });
    var num0 = function(n){ return Number(n).toLocaleString('he-IL'); };
    $('stbl').innerHTML = so.map(function(k){
      var o = S[k], left;
      if(!o.e && !o.unk) left = '<span class="ok">✓ סגור</span>';
      else if(!o.e) left = '<span class="q">סכום לא ידוע</span>';
      else left = '<span class="left">'+num0(o.e)+'</span>'+(o.unk?' <span class="q">+?</span>':'');
      var h = '<tr class="sup" data-s="'+esc(k)+'"><td>'+esc(k)+' '+(openS[k]?'▴':'▾')+'<button class="pbtn" type="button" data-p="'+esc(k)+'">שילמתי</button></td><td class="m">'+(o.p?num0(o.p):'—')+'</td><td class="m">'+left+'</td></tr>';
      if(payS===k) h += '<tr class="payrow"><td colspan="3"><div class="payf">'+
          '<label>כמה שילמת ל'+esc(k)+'?<input id="pamt" inputmode="numeric" placeholder="0"></label>'+
          '<label>תאריך<input id="pdate" type="date" value="'+today()+'"></label>'+
          '<button class="ok2" type="button">אישור</button><button class="no2" type="button">ביטול</button>'+
          (o.e?'<div class="nt">יורד אוטומטית ממה שנשאר לשלם ('+num0(o.e)+')</div>':'')+'</div></td></tr>';
      if(openS[k]) h += o.list.slice().sort(function(a,b){return (a.d||'9')<(b.d||'9')?-1:1}).map(function(r){
        return '<tr class="det"><td>'+(r.d?shortDate(r.d)+' · ':'')+esc(r.who)+'</td><td class="m">'+(r.exp?'':num0(r.amt))+'</td><td class="m">'+(r.exp?(r.amt?num0(r.amt):'?'):'')+'</td></tr>';
      }).join('');
      return h;
    }).join('');
    $('sfoot').innerHTML = '<tr><td>סך הכול</td><td class="m">'+num0(pt)+'</td><td class="m">'+num0(et)+(unk?' <span class="q">+?</span>':'')+'</td></tr>';
    var byDate = function(a,b){var ad=a.d||'',bd=b.d||'';return ad<bd?1:ad>bd?-1:b.id-a.id};
    function plain(cls,id,label){ return '<button class="'+cls+'" data-id="'+id+'" type="button">'+label+'</button>'; }
    function row(r, sub){
      var h = '<li'+(sub?' class="sub"':'')+'><span class="d">'+shortDate(r.d)+'</span><span class="n">'+esc(r.who)+'</span><span class="a">'+(r.amt?fmt(r.amt):'סכום לא ידוע')+'</span><span class="acts">'+
        (r.exp ? plain('part',r.id,'חלקי') : '') + plain('edit',r.id,'ערוך') +
        (r.exp ? btn('pay',r.id,'שולם ✓','לסמן שולם?') : '') + btn('del',r.id,'מחק','למחוק?') + '</span></li>';
      if(partId===r.id) h += '<li class="pp"><span>כמה שולם עכשיו?</span><input id="ppamt" inputmode="numeric" placeholder="0">'+
          '<button class="ppok" type="button">אישור</button><button class="ppno" type="button">ביטול</button></li>';
      if(editId===r.id) h += '<li class="ed"><label>למי / על מה<input id="edwho" value="'+esc(r.who)+'"></label>'+
          '<label>סכום (₪)<input id="edamt" inputmode="numeric" value="'+(r.amt||'')+'"></label>'+
          '<label>תאריך<input id="eddate" type="date" value="'+(r.d||'')+'"></label>'+
          '<button class="edok" type="button">שמירה</button><button class="edno" type="button">ביטול</button></li>';
      return h;
    }
    /* צפוי לשלם: שורות עם אותו שם מוצגות יחד בשורה אחת שאפשר לפתוח */
    var groups = {}, order = [];
    exp.slice().sort(function(a,b){return (a.d||'9')<(b.d||'9')?-1:(a.d||'9')>(b.d||'9')?1:a.id-b.id}).forEach(function(r){
      var k = r.who.trim(); if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(r);
    });
    $('elist').innerHTML = exp.length ? order.map(function(k){
      var gr = groups[k]; if(gr.length===1) return row(gr[0], false);
      var s = gr.reduce(function(t,r){return t+r.amt},0), isOpen = !!openG[k];
      return '<li class="grp" data-g="'+esc(k)+'"><span class="d">'+shortDate(gr[0].d)+'</span><span class="n"><b>'+esc(k)+'</b> <span class="cnt">· '+gr.length+' שורות '+(isOpen?'▴ סגור':'▾ פתח')+'</span></span><span class="a">'+(s?fmt(s):'סכום לא ידוע')+'</span></li>'+
        (isOpen ? gr.map(function(r){return row(r, true)}).join('') : '');
    }).join('') : '<li class="empty">אין כרגע תשלומים צפויים. בחר "צפוי לשלם" למעלה כדי להוסיף.</li>';
    $('list').innerHTML = paid.length ? paid.slice().sort(byDate).map(function(r){ return row(r, false); }).join('') : '<li class="empty">עדיין אין תשלומים.</li>';
  }

  $('f').addEventListener('submit', function(e){
    e.preventDefault(); if(busy) return;
    var who = $('who').value.trim();
    var amt = Math.round(parseFloat(($('amt').value||'').replace(/[^\d.]/g,''))) || 0;
    if(!who || (!amt && kind==='paid')){ $('msg').textContent = 'צריך למלא שם וסכום.'; return; }
    var r = {d:$('date').value || (kind==='exp' ? null : today()), who:who, amt:amt, exp:kind==='exp'};
    busy = true; $('addbtn').disabled = true; $('msg').textContent = 'שומר…';
    db.from(T).insert(r).select('id,d,who,amt,exp').then(function(res){
      if(res.error){ done(res); return; }
      rows.push(res.data[0]); $('who').value=''; $('amt').value='';
      if(kind==='exp'){ render(); done(res, 'נוסף לצפי: ' + who + ' ' + fmt(amt)); return; }
      offset(skey(who), amt, function(r2, note){ render(); done(r2, 'נוסף: ' + who + ' ' + fmt(amt) + note); });
    });
  });

  $('appView').addEventListener('click', function(e){
    if(busy) return;
    var t = e.target;
    if(t.closest('.ppok')){ payPart(); return; }
    if(t.closest('.edok')){ saveEdit(); return; }
    if(t.closest('.ppno,.edno')){ partId = null; editId = null; render(); return; }
    var pt = t.closest('.part,.edit');
    if(pt){ var pid = +pt.getAttribute('data-id'), isPart = pt.classList.contains('part');
      if(isPart){ partId = (partId===pid ? null : pid); editId = null; } else { editId = (editId===pid ? null : pid); partId = null; }
      armed = null; render();
      var inp = $(isPart ? 'ppamt' : 'edamt'); if(inp && (partId||editId)) inp.focus(); return; }
    if(t.closest('.ok2')){ paySupplier(); return; }
    if(t.closest('.no2')){ payS = null; render(); return; }
    if(t.closest('tr.payrow')) return;
    var pb = t.closest('.pbtn');
    if(pb){ var pk = pb.getAttribute('data-p'); payS = (payS===pk?null:pk); render(); var pi=$('pamt'); if(pi) pi.focus(); return; }
    var st = t.closest('tr.sup');
    if(st){ var sk = st.getAttribute('data-s'); openS[sk] = !openS[sk]; render(); return; }
    var gl = t.closest('li.grp');
    if(gl){ var gk = gl.getAttribute('data-g'); openG[gk] = !openG[gk]; render(); return; }
    var b = t.closest('.del,.pay'); if(!b) return;
    var k = b.getAttribute('data-k'), id = +b.getAttribute('data-id');
    if(armed !== k){ armed = k; render(); return; }
    armed = null;
    var r = rows.filter(function(x){return x.id===id})[0]; if(!r) return;
    busy = true;
    if(b.classList.contains('pay')){
      r.exp = false; r.d = today(); render();
      db.from(T).update({exp:false, d:r.d}).eq('id', id).then(function(res){ done(res, 'סומן כשולם: ' + r.who); });
    } else {
      rows = rows.filter(function(x){return x.id!==id}); render();
      db.from(T).delete().eq('id', id).then(function(res){ done(res, 'נמחק: ' + r.who); });
    }
  });


  /* קיזוז: תשלום ששולם יורד מהצפוי של אותו ספק (מהישן לחדש) */
  var skey = function(w){ return w.trim().replace(/^תשלום\s+ל/,'').split(/[\s–-]+/)[0]; };
  function offset(k, amount, cb){
    var ex = rows.filter(function(r){ return r.exp && r.amt>0 && skey(r.who)===k; }).sort(function(a,b){return a.id-b.id});
    var left = amount, ops = [];
    ex.forEach(function(r){
      if(left<=0) return;
      if(left>=r.amt){ left-=r.amt; rows = rows.filter(function(x){return x.id!==r.id}); ops.push(db.from(T).delete().eq('id', r.id)); }
      else { r.amt -= left; left = 0; ops.push(db.from(T).update({amt:r.amt}).eq('id', r.id)); }
    });
    Promise.all(ops).then(function(res){
      var err = res.filter(function(x){return x.error})[0];
      var rest = rows.filter(function(r){ return r.exp && skey(r.who)===k; }).reduce(function(t,r){return t+r.amt},0);
      cb(err||{}, ex.length ? (rest ? ' · נשאר לשלם ' + fmt(rest) : ' · סגור ✓') : '');
    });
  }
  function paySupplier(){
    var k = payS; if(!k) return;
    var amt = num('pamt'), d = $('pdate').value || today();
    if(!amt){ $('msg').textContent = 'צריך לכתוב כמה שילמת.'; return; }
    busy = true; payS = null;
    db.from(T).insert({d:d, who:k, amt:amt, exp:false}).select('id,d,who,amt,exp').then(function(res){
      if(res.error){ done(res); return; }
      rows.push(res.data[0]);
      offset(k, amt, function(r2, note){ render(); done(r2, 'נרשם: ' + k + ' ' + fmt(amt) + note); });
    });
  }
  function num(id){ return Math.round(parseFloat(($(id).value||'').replace(/[^\d.]/g,''))) || 0; }

  /* תשלום חלקי: רושם את מה ששולם ומוריד אותו מהסכום הצפוי */
  function payPart(){
    var r = rows.filter(function(x){return x.id===partId})[0]; if(!r) return;
    var p = num('ppamt');
    if(!p){ $('msg').textContent = 'צריך לכתוב כמה שולם.'; return; }
    if(r.amt && p >= r.amt){ $('msg').textContent = 'הסכום שווה ליתרה או גדול ממנה – לחץ "שולם ✓" במקום.'; return; }
    busy = true; partId = null;
    var paidRow = {d:today(), who:r.who + ' – תשלום חלקי', amt:p, exp:false};
    var left = r.amt ? r.amt - p : 0;
    db.from(T).insert(paidRow).select('id,d,who,amt,exp').then(function(res){
      if(res.error){ done(res); return; }
      rows.push(res.data[0]);
      if(!r.amt){ render(); done(res, 'נרשם תשלום חלקי: ' + fmt(p)); return; }
      r.amt = left; render();
      db.from(T).update({amt:left}).eq('id', r.id).then(function(res2){
        done(res2, 'נרשם תשלום חלקי ' + fmt(p) + ' · נשאר לשלם ' + fmt(left));
      });
    });
  }

  /* עריכת שורה: שם, סכום ותאריך */
  function saveEdit(){
    var r = rows.filter(function(x){return x.id===editId})[0]; if(!r) return;
    var who = $('edwho').value.trim(), amt = num('edamt'), d = $('eddate').value || null;
    if(!who || (!amt && !r.exp)){ $('msg').textContent = 'צריך למלא שם וסכום.'; return; }
    if(!r.exp && !d) d = r.d || today();
    busy = true; editId = null;
    r.who = who; r.amt = amt; r.d = d; render();
    db.from(T).update({who:who, amt:amt, d:d}).eq('id', r.id).then(function(res){ done(res, 'עודכן: ' + who + ' ' + fmt(amt)); });
  }
  $('appView').addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.id==='pamt'){ e.preventDefault(); paySupplier(); }
    else if(e.target.id==='ppamt'){ e.preventDefault(); payPart(); }
    else if(/^ed(who|amt|date)$/.test(e.target.id)){ e.preventDefault(); saveEdit(); }
  });
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
