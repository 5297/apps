<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>עלויות השיפוץ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f62">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --fg:#1d2624; --muted:#62716d; --line:#d8dfdc;
  --accent:#2f6f62; --accent-ink:#ffffff; --danger:#b3412f; --exp:#9a6a12; --exp-bg:#fbf4e4;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a19; --card:#1c2422; --fg:#e7eeec; --muted:#93a39f; --line:#2c3633;
  --accent:#5fb3a1; --accent-ink:#0f1513; --danger:#e07a68; --exp:#e0b45c; --exp-bg:#2a2416; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px}
h1{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--muted);font-weight:500}
.total{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.95rem}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box .l{font-size:.85rem;color:var(--muted)}
.box .v{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.box.e{background:var(--exp-bg);border-color:var(--exp)} .box.e .v{color:var(--exp)}
h2{font-family:var(--display);font-size:1rem;font-weight:500;margin:0 0 8px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
.kind{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kind button{border:0;background:var(--bg);color:var(--muted);padding:10px;font-weight:600}
.kind button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kind button.ex[aria-pressed="true"]{background:var(--exp);color:#fff}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.add{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;font-weight:600;font-size:1rem}
.add.ex{background:var(--exp);color:#fff}
.add.sec{background:none;color:var(--accent);border:1px solid var(--accent)}
.add:disabled{opacity:.6}
.msg{grid-column:1/-1;font-size:.9rem;color:var(--muted);min-height:1.2em}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);font-variant-numeric:tabular-nums}
.chip b{font-weight:600} .chip i{font-style:normal;color:var(--exp);font-size:.9em}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
#elist li{grid-template-columns:auto 1fr auto auto auto}
#elist .a{color:var(--exp)}
.d{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:3.2em}
.n{min-width:0;overflow-wrap:anywhere}
.a{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.del,.pay{background:none;border:0;color:var(--muted);padding:4px 6px;font-size:.85rem}
.pay{color:var(--accent);font-weight:600}
.del.arm,.pay.arm{color:var(--danger);font-weight:600}
.empty{color:var(--muted);padding:12px 0;display:block}
.out{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;justify-self:start;padding:0}
@media (max-width:420px){form{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- כניסה -->
<div class="wrap" id="loginView" hidden>
  <h1>עלויות השיפוץ – כניסה</h1>
  <form id="lf" autocomplete="on">
    <label class="full">דואר אלקטרוני<input id="email" type="email" required autocomplete="email"></label>
    <label class="full">סיסמה<input id="pass" type="password" required minlength="6" autocomplete="current-password"></label>
    <button class="add" type="submit" id="loginBtn">כניסה</button>
    <button class="add sec" type="button" id="signupBtn">פתיחת משתמש חדש</button>
    <div class="msg" id="lmsg" aria-live="polite"></div>
  </form>
</div>

<!-- האפליקציה -->
<div class="wrap" id="appView" hidden>
  <header>
    <h1>עלויות השיפוץ – שולם עד היום</h1>
    <div class="total" id="total">…</div>
    <div class="sub" id="count"></div>
    <div class="fc">
      <div class="box e"><div class="l">צפוי לשלם עוד</div><div class="v" id="etotal">…</div></div>
      <div class="box"><div class="l">צפי סך הכול לשיפוץ</div><div class="v" id="ftotal">…</div></div>
    </div>
  </header>
  <form id="f" autocomplete="off">
    <div class="kind" role="group" aria-label="סוג">
      <button type="button" id="kpaid" aria-pressed="true">שולם</button>
      <button type="button" id="kexp" class="ex" aria-pressed="false">צפוי לשלם</button>
    </div>
    <label class="full">למי / על מה<input id="who" required placeholder="למשל: סאלח, קרמיקה טורעאן"></label>
    <label>סכום (₪)<input id="amt" inputmode="numeric" placeholder="0"></label>
    <label><span id="dlabel">תאריך</span><input id="date" type="date"></label>
    <button class="add" id="addbtn" type="submit">הוסף תשלום</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>
  <section><h2>צפוי לשלם</h2><ul id="elist"></ul></section>
  <section><h2>לפי ספק (שולם · <span style="color:var(--exp)">צפוי</span>)</h2><div class="sum" id="sum"></div></section>
  <section><h2>כל התשלומים ששולמו</h2><ul id="list"></ul></section>
  <button class="out" id="logout" type="button">יציאה מהמשתמש</button>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var db = supabase.createClient(window.APP_CONFIG.url, window.APP_CONFIG.key);
  var T = 'renovation_payments';
  var rows = [], busy = false, armed = null, kind = 'paid';
  var $ = function(id){return document.getElementById(id)};
  var fmt = function(n){return Number(n||0).toLocaleString('he-IL') + ' ₪'};
  var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var shortDate = function(d){if(!d) return '—'; var p=d.split('-');return (+p[2])+'.'+(+p[1])};
  function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}

  /* ---------- כניסה ---------- */
  function show(view){ $('loginView').hidden = view!=='login'; $('appView').hidden = view!=='app'; }
  $('lf').addEventListener('submit', function(e){
    e.preventDefault(); $('lmsg').textContent = 'נכנס…';
    db.auth.signInWithPassword({email:$('email').value.trim(), password:$('pass').value}).then(function(r){
      if(r.error) $('lmsg').textContent = 'הכניסה נכשלה: בדוק דואר וסיסמה.';
    });
  });
  $('signupBtn').addEventListener('click', function(){
    var em = $('email').value.trim(), pw = $('pass').value;
    if(!em || pw.length < 6){ $('lmsg').textContent = 'מלא דואר וסיסמה (לפחות 6 תווים).'; return; }
    $('lmsg').textContent = 'פותח משתמש…';
    db.auth.signUp({email:em, password:pw}).then(function(r){
      if(r.error) $('lmsg').textContent = 'לא הצלחתי לפתוח משתמש: ' + r.error.message;
      else if(!r.data.session) $('lmsg').textContent = 'נשלח אליך מייל אישור. לחץ על הקישור שבו ואז היכנס כאן.';
    });
  });
  $('logout').addEventListener('click', function(){ db.auth.signOut(); });
  db.auth.onAuthStateChange(function(ev, session){
    if(session){ show('app'); load(); } else { show('login'); }
  });

  /* ---------- נתונים ---------- */
  function load(){
    db.from(T).select('id,d,who,amt,exp').order('id').then(function(r){
      if(r.error){ $('msg').textContent = 'טעינה נכשלה. נסה לרענן.'; return; }
      rows = r.data; render();
    });
  }
  function done(r, text){
    busy = false; $('addbtn').disabled = false;
    if(r.error){ $('msg').textContent = 'השמירה נכשלה. נסה שוב.'; load(); }
    else { $('msg').textContent = text; }
  }

  function setKind(k){
    kind = k;
    $('kpaid').setAttribute('aria-pressed', k==='paid');
    $('kexp').setAttribute('aria-pressed', k==='exp');
    $('addbtn').textContent = k==='exp' ? 'הוסף לצפי' : 'הוסף תשלום';
    $('addbtn').className = 'add' + (k==='exp' ? ' ex' : '');
    $('dlabel').textContent = k==='exp' ? 'מתי בערך (לא חובה)' : 'תאריך';
    $('date').value = k==='exp' ? '' : today();
  }
  $('kpaid').addEventListener('click', function(){setKind('paid')});
  $('kexp').addEventListener('click', function(){setKind('exp')});
  $('date').value = today();

  function btn(cls, id, label, armLabel){
    var key = cls + id;
    return '<button class="'+cls+(armed===key?' arm':'')+'" data-k="'+key+'" data-id="'+id+'" type="button">'+(armed===key?armLabel:label)+'</button>';
  }

  function render(){
    var paid = rows.filter(function(r){return !r.exp});
    var exp = rows.filter(function(r){return r.exp});
    var pt = paid.reduce(function(s,r){return s+r.amt},0);
    var et = exp.reduce(function(s,r){return s+r.amt},0);
    $('total').textContent = fmt(pt);
    $('etotal').textContent = fmt(et);
    $('ftotal').textContent = fmt(pt+et);
    var unk = exp.filter(function(r){return !r.amt}).length;
    $('count').textContent = paid.length + ' תשלומים · ' + exp.length + ' צפויים' + (unk ? ' (' + unk + ' מהם בלי סכום – לא נכללים בצפי)' : '');
    var g = {}, ge = {};
    rows.forEach(function(r){var k=r.who.trim().split(/[\s–-]+/)[0]; if(r.exp){ge[k]=(ge[k]||0)+r.amt; g[k]=g[k]||0} else g[k]=(g[k]||0)+r.amt});
    var keys = Object.keys(g).sort(function(a,b){return (g[b]+(ge[b]||0))-(g[a]+(ge[a]||0))});
    $('sum').innerHTML = keys.map(function(k){return '<span class="chip">'+esc(k)+' · <b>'+fmt(g[k])+'</b>'+(ge[k]?' <i>+ '+fmt(ge[k])+'</i>':'')+'</span>'}).join('');
    var byDate = function(a,b){var ad=a.d||'',bd=b.d||'';return ad<bd?1:ad>bd?-1:b.id-a.id};
    $('elist').innerHTML = exp.length ? exp.slice().sort(function(a,b){return (a.d||'9')<(b.d||'9')?-1:1}).map(function(r){
      return '<li><span class="d">'+shortDate(r.d)+'</span><span class="n">'+esc(r.who)+'</span><span class="a">'+(r.amt?fmt(r.amt):'סכום לא ידוע')+'</span>'+
        btn('pay',r.id,'שולם ✓','לסמן שולם?') + btn('del',r.id,'מחק','למחוק?')+'</li>'
    }).join('') : '<li class="empty">אין כרגע תשלומים צפויים. בחר "צפוי לשלם" למעלה כדי להוסיף.</li>';
    $('list').innerHTML = paid.length ? paid.slice().sort(byDate).map(function(r){
      return '<li><span class="d">'+shortDate(r.d)+'</span><span class="n">'+esc(r.who)+'</span><span class="a">'+fmt(r.amt)+'</span>'+
        btn('del',r.id,'מחק','למחוק?')+'</li>'
    }).join('') : '<li class="empty">עדיין אין תשלומים.</li>';
  }

  $('f').addEventListener('submit', function(e){
    e.preventDefault(); if(busy) return;
    var who = $('who').value.trim();
    var amt = Math.round(parseFloat(($('amt').value||'').replace(/[^\d.]/g,''))) || 0;
    if(!who || (!amt && kind==='paid')){ $('msg').textContent = 'צריך למלא שם וסכום.'; return; }
    var r = {d:$('date').value || (kind==='exp' ? null : today()), who:who, amt:amt, exp:kind==='exp'};
    busy = true; $('addbtn').disabled = true; $('msg').textContent = 'שומר…';
    db.from(T).insert(r).select('id,d,who,amt,exp').then(function(res){
      if(!res.error){ rows.push(res.data[0]); render(); $('who').value=''; $('amt').value=''; }
      done(res, (kind==='exp'?'נוסף לצפי: ':'נוסף: ') + who + ' ' + fmt(amt));
    });
  });

  $('appView').addEventListener('click', function(e){
    var b = e.target.closest('.del,.pay'); if(!b || busy) return;
    var k = b.getAttribute('data-k'), id = +b.getAttribute('data-id');
    if(armed !== k){ armed = k; render(); return; }
    armed = null;
    var r = rows.filter(function(x){return x.id===id})[0]; if(!r) return;
    busy = true;
    if(b.classList.contains('pay')){
      r.exp = false; r.d = today(); render();
      db.from(T).update({exp:false, d:r.d}).eq('id', id).then(function(res){ done(res, 'סומן כשולם: ' + r.who); });
    } else {
      rows = rows.filter(function(x){return x.id!==id}); render();
      db.from(T).delete().eq('id', id).then(function(res){ done(res, 'נמחק: ' + r.who); });
    }
  });
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
