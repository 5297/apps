<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עזר מציון טבריה</title>
<meta name="theme-color" content="#d7191f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --red:#d7191f; --red-d:#a80f14; --bg:#f4f5f7; --card:#fff; --ink:#1d1f23; --mute:#6b7280; --line:#e5e7eb; --ok:#15803d; --warn:#b45309; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; font-size:17px; }
  header { background:var(--red); color:#fff; padding:10px 14px calc(10px); padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  header img { width:40px; height:40px; border-radius:10px; background:#fff; }
  header h1 { font-size:19px; margin:0; flex:1; }
  header .who { font-size:13px; opacity:.9; text-align:left; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:10px; padding:8px 10px; font-size:15px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:60px; z-index:4; overflow-x:auto; }
  nav button { flex:1; border:0; background:none; padding:13px 6px; font-size:16px; color:var(--mute); border-bottom:3px solid transparent; white-space:nowrap; position:relative; }
  nav button.on { color:var(--red); border-bottom-color:var(--red); font-weight:700; }
  nav .cnt { background:var(--red); color:#fff; border-radius:10px; font-size:12px; padding:1px 7px; margin-inline-start:4px; }
  main { padding:12px; max-width:640px; margin:0 auto; padding-bottom:80px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .route { font-size:19px; font-weight:700; line-height:1.4; }
  .route .arrow { color:var(--red); margin:0 4px; }
  .due { margin-top:6px; color:var(--warn); font-weight:600; }
  .meta { color:var(--mute); font-size:14px; margin-top:6px; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { border:0; border-radius:12px; padding:13px 16px; font-size:17px; font-weight:700; background:var(--red); color:#fff; flex:1; text-align:center; text-decoration:none; display:inline-block; }
  .btn:active { background:var(--red-d); }
  .btn.sec { background:#eef0f3; color:var(--ink); }
  .btn.ok { background:var(--ok); }
  .btn.sm { padding:9px 12px; font-size:15px; flex:0 0 auto; }
  .btn[disabled] { opacity:.5; }
  label { display:block; font-weight:600; margin:12px 0 5px; }
  input,textarea,select { width:100%; font-size:17px; padding:12px; border:1px solid #cfd3da; border-radius:10px; background:#fff; font-family:inherit; }
  textarea { min-height:80px; }
  .hint { color:var(--mute); font-size:14px; margin-top:4px; }
  .empty { text-align:center; color:var(--mute); padding:40px 10px; }
  .banner { background:#fff7e6; border:1px solid #f5c56b; border-radius:12px; padding:12px; margin-bottom:12px; }
  .banner b { display:block; margin-bottom:6px; }
  .pill { display:inline-block; font-size:13px; border-radius:20px; padding:2px 10px; background:#eef0f3; color:var(--ink); margin-inline-start:6px; }
  .pill.open { background:#fde8e8; color:var(--red-d); }
  .pill.taken { background:#fff1d6; color:var(--warn); }
  .pill.done { background:#dcfce7; color:var(--ok); }
  .pill.cancelled { background:#eee; color:#888; }
  .det { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); white-space:pre-wrap; }
  .stop { border:1px solid var(--line); border-radius:12px; padding:8px 10px 10px; margin-top:8px; background:#fafafa; }
  .stop .sh { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:15px; color:var(--mute); }
  .stop .sh button { background:none; border:0; color:var(--red-d); font-size:15px; }
  .addln { background:none; border:0; color:var(--red-d); font-weight:700; font-size:15px; padding:8px 0; }
  .sv { margin-top:6px; } .sv + .sv { border-top:1px dotted var(--line); padding-top:6px; }
  .det a { color:var(--red-d); font-weight:700; }
  .login { max-width:420px; margin:30px auto; text-align:center; }
  .login img { width:150px; height:150px; border-radius:24px; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  .login .card { text-align:right; margin-top:18px; }
  .tabs2 { display:flex; gap:6px; margin-bottom:6px; }
  .tabs2 button { flex:1; padding:11px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:16px; }
  .tabs2 button.on { background:var(--red); color:#fff; border-color:var(--red); font-weight:700; }
  .err { color:var(--red-d); font-weight:600; margin-top:10px; min-height:1em; }
  #toast { position:fixed; top:50%; bottom:auto; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:12px 18px; border-radius:12px; font-size:16px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:30; max-width:90%; text-align:center; }
  #toast.on { opacity:1; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  #modal.on { display:flex; }
  #modal .card { width:100%; max-width:420px; margin:0; }
  #modal h3 { margin:0 0 8px; }
  .usr { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .usr .nm { font-weight:700; flex:1; min-width:140px; }
  h2 { font-size:18px; margin:18px 4px 10px; }
  .split { display:flex; gap:8px; } .split > div { flex:1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="card" id="modalBody"></div></div>

async function rpc(fn, args = {}) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  const txt = await r.text();
  let d = null; try { d = txt ? JSON.parse(txt) : null; } catch { d = txt; }
  if (!r.ok) throw new Error((d && d.message) || 'שגיאה בחיבור');
  return d;
}
function notify(type, task_id) {
  return fetch(`${SB_URL}/functions/v1/ezer-notify`, {
    method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: S.token, type, task_id }),
  }).then((r) => r.json()).catch(() => ({}));
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
function confirmBox(title, text, okLabel = 'אישור') {
  return new Promise((res) => {
    $('#modalBody').innerHTML = `<h3>${esc(title)}</h3><div>${text}</div><div class="row"><button class="btn" id="mOk">${esc(okLabel)}</button><button class="btn sec" id="mNo">ביטול</button></div>`;
    $('#modal').classList.add('on');
    $('#mOk').onclick = () => { $('#modal').classList.remove('on'); res(true); };
    $('#mNo').onclick = () => { $('#modal').classList.remove('on'); res(false); };
  });
}

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function fmtDue(t) {
  if (t.due_text) return t.due_text;
  if (!t.due_at) return '';
  const d = new Date(t.due_at), now = new Date();
  const day0 = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(d) - day0(now)) / 86400000);
  const hm = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  let dayTxt = diff === 0 ? 'היום' : diff === 1 ? 'מחר' : diff === -1 ? 'אתמול' : `יום ${DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  return `${dayTxt} בשעה ${hm}`;
}
function stopList(t, kind) {
  const arr = Array.isArray(t[kind]) ? t[kind] : null;
  if (arr && arr.length) return arr;
  return kind === 'pickups'
    ? [{ place: t.from_place, name: t.contact_name, phones: t.contact_phone ? [t.contact_phone] : [] }]
    : [{ place: t.to_place, name: t.to_contact_name, phones: t.to_contact_phone ? [t.to_contact_phone] : [] }];
}
function contactsHtml(t, nav) {
  const one = (lbl, st, i, n) => {
    const ph = (st.phones || []).filter(Boolean);
    return `<div class="sv"><b>${lbl}${n > 1 ? ' ' + (i + 1) : ''}:</b> 📍 ${esc(st.place || '')}
      ${st.name ? `<div>👤 ${esc(st.name)}</div>` : ''}${ph.map((p) => `<div>📞 ${telLink(p)}</div>`).join('')}
      ${nav && st.place ? `<div><a href="${wazeLink(st.place)}" target="_blank">ניווט לכאן ←</a></div>` : ''}</div>`.replace(/\n\s*/g, '');
  };
  const a = stopList(t, 'pickups'), b = stopList(t, 'drops');
  return a.map((st, i) => one('איסוף', st, i, a.length)).join('') + b.map((st, i) => one('פיזור', st, i, b.length)).join('');
}
function stopBlock(kind, first) {
  return `<div class="stop" data-kind="${kind}">
    <div class="sh"><span>${kind === 'p' ? 'כתובת איסוף' : 'כתובת פיזור'}</span>${first ? '' : '<button type="button" data-rmstop>✕ הסר</button>'}</div>
    <label>כתובת (רחוב / מקום)</label><input class="sPlace">
    <label>איש קשר</label><input class="sName">
    <label>טלפון</label><div class="sPhones"><input class="sPhone" type="tel" inputmode="tel"></div>
    <button type="button" class="addln" data-addph>+ עוד מספר טלפון</button>
  </div>`;
}
function routeHtml(t) { return `<div class="route">${esc(t.from_place)}<span class="arrow">←</span>${esc(t.to_place)}</div>`; }
function telLink(p) { const n = String(p || '').replace(/[^0-9+]/g, ''); return n ? `<a href="tel:${n}">${esc(p)}</a>` : ''; }
function wazeLink(place) { return `https://waze.com/ul?q=${encodeURIComponent(place + ' טבריה')}&navigate=yes`; }

function renderLogin() {
  const reg = S.loginTab === 'reg';
  $('#app').innerHTML = `
  <div class="login">
    <img src="${LOGO}" alt="">
    <h2 style="margin-top:14px">עזר מציון טבריה</h2>
    <div class="meta">משימות שינוע למתנדבים</div>
    <div class="card">
      <div class="tabs2"><button id="tLogin" class="${reg ? '' : 'on'}">כניסה</button><button id="tReg" class="${reg ? 'on' : ''}">הרשמה</button></div>
      ${reg ? `<label>שם מלא</label><input id="fName" autocomplete="name">` : ''}
      <label>מספר טלפון</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel">
      <label>${reg ? 'בחר קוד כניסה (4 ספרות)' : 'קוד כניסה (4 ספרות)'}</label>
      <input id="fPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*">
      ${reg ? '<div class="hint">את הקוד תצטרך כדי להיכנס מטלפון אחר. אחרי ההרשמה מנהל צריך לאשר אותך.</div>' : ''}
      <div class="err" id="fErr"></div>
      <div class="row"><button class="btn" id="fGo">${reg ? 'הרשמה' : 'כניסה'}</button></div>
    </div>
  </div>`;
  $('#tLogin').onclick = () => { S.loginTab = 'login'; renderLogin(); };
  $('#tReg').onclick = () => { S.loginTab = 'reg'; renderLogin(); };
  $('#fGo').onclick = async () => {
    const btn = $('#fGo'); btn.disabled = true; $('#fErr').textContent = '';
    try {
      const phone = $('#fPhone').value, pin = $('#fPin').value;
      const r = reg ? await rpc('ezer_register', { p_name: $('#fName').value, p_phone: phone, p_pin: pin })
                    : await rpc('ezer_login', { p_phone: phone, p_pin: pin });
      S.token = r.token; try { localStorage.setItem('ezer_token', r.token); } catch {}
      if (reg) { notify('register'); if (pushSupported() && Notification.permission === 'default') enablePush(); }
      await start();
    } catch (e) { $('#fErr').textContent = e.message; btn.disabled = false; }
  };
}

// ---------- push ----------
function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (S.me) render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('האפליקציה הותקנה ✔'); if (S.me) render(); });
function installBanner() {
  if (!deferredInstall) return '';
  return `<div class="banner" style="background:#eef6ff;border-color:#9cc3f5"><b>התקן את האפליקציה למסך הבית</b>כך היא תיפתח כמו אפליקציה רגילה עם הסמל של עזר מציון.<div class="row"><button class="btn" id="instBtn">התקן 📲</button></div></div>`;
}
function bindInstall() { const b = $('#instBtn'); if (b) b.onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); }; }
function pushBanner() {
  if (!pushSupported()) return `<div class="banner"><b>הטלפון לא תומך בהתראות כאן</b>כדי לקבל התראות, פתח את האפליקציה בכרום והוסף אותה למסך הבית.</div>`;
  if (S.pushOk) return '';
  if (Notification.permission === 'denied') return `<div class="banner"><b>ההתראות חסומות בטלפון – 3 צעדים קצרים:</b>
    <ol style="margin:6px 0;padding-inline-start:20px;line-height:1.7">
      <li>לחץ על הסמל הקטן <b>שמשמאל לכתובת</b> למעלה (⚙ או 🔒)</li>
      <li>בחר <b>הרשאות</b> / <b dir="ltr">Permissions</b></li>
      <li>ליד <b>התראות</b> / <b dir="ltr">Notifications</b> בחר <b>אפשר</b> / <b dir="ltr">Allow</b></li>
    </ol>
    <div class="hint">אם אין שם התראות: הגדרות הטלפון ← אפליקציות ← כרום ← התראות ← להדליק.</div>
    <div class="row"><button class="btn" onclick="location.reload()">סידרתי – נסה שוב</button></div></div>`;
  return `<div class="banner"><b>הפעל התראות</b>כדי לקבל התראה בכל פעם שמתפרסמת משימה חדשה.${S.pushErr ? `<div class="err">${esc(S.pushErr)}</div>` : ''}<div class="row"><button class="btn" id="pushOn">הפעל התראות 🔔</button></div></div>`;
}
function bindPush() { const b = $('#pushOn'); if (b) b.onclick = enablePush; }
function b64ToU8(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); }
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { S.pushErr = perm === 'denied' ? (Notification.permission === 'denied' ? '' : 'הבקשה לאישור התראות נדחתה.') : 'לא התקבל אישור להתראות.'; render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const opts = { userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID) };
      try { sub = await reg.pushManager.subscribe(opts); }
      catch { await new Promise((r) => setTimeout(r, 1500)); sub = await reg.pushManager.subscribe(opts); }
    }
    const j = sub.toJSON();
    await rpc('ezer_save_push', { p_token: S.token, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    S.pushOk = true; S.pushErr = '';
    toast('ההתראות הופעלו ✔');
    render();
  } catch (e) { S.pushErr = 'ההרשמה להתראות נכשלה' + (e && e.message ? ': ' + e.message : '.'); render(); }
}
async function checkPush() {
  if (!pushSupported() || Notification.permission !== 'granted') { S.pushOk = false; return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      const j = sub.toJSON();
      await rpc('ezer_save_push', { p_token: S.token, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
      S.pushOk = true;
    } else S.pushOk = false;
  } catch { S.pushOk = false; }
}

// ---------- main ----------
async function load() {
  const isMgr = S.me.role === 'manager';
  const jobs = [rpc('ezer_open_tasks', { p_token: S.token }), rpc('ezer_my_tasks', { p_token: S.token })];
  if (isMgr) jobs.push(rpc('ezer_all_tasks', { p_token: S.token }), rpc('ezer_users_list', { p_token: S.token }));
  const [o, m, a, u] = await Promise.all(jobs);
  S.open = o || []; S.mine = m || []; S.all = a || []; S.users = u || [];
}

function render() {
  if (!S.me) return renderLogin();
  if (!S.me.approved) return renderPending();
  const isMgr = S.me.role === 'manager';
  const pending = S.users.filter((u) => !u.approved && !u.blocked).length;
  const myActive = S.mine.filter((t) => t.status === 'taken').length;
  const tabs = [['open', 'משימות פתוחות', S.open.length], ['mine', 'המשימות שלי', myActive]];
  if (isMgr) tabs.push(['manage', 'ניהול', 0], ['users', 'מתנדבים', pending]);
  if (!tabs.some((t) => t[0] === S.tab)) S.tab = 'open';
  $('#app').innerHTML = `
  <header>
    <img src="${LOGO}" alt="">
    <h1>עזר מציון טבריה</h1>
    <div class="who">${esc(S.me.name)}${isMgr ? '<br>מנהל' : ''}</div>
    <button id="hRef" title="רענון">⟳</button>
  </header>
  <nav>${tabs.map(([k, l, c]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}${c ? `<span class="cnt">${c}</span>` : ''}</button>`).join('')}</nav>
  <main>${pushBanner()}${installBanner()}${body()}</main>`;
  bindPush(); bindInstall();
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; location.hash = S.tab; render(); window.scrollTo(0, 0); });
  $('#hRef').onclick = refresh;
  bind();
}

function body() {
  if (S.tab === 'open') {
    if (!S.open.length) return `<div class="empty">אין כרגע משימות פתוחות 👍<br>תקבל התראה כשתתפרסם משימה חדשה.</div>`;
    return S.open.map((t) => `
      <div class="card">
        ${routeHtml(t)}
        ${fmtDue(t) ? `<div class="due">⏰ ${esc(fmtDue(t))}</div>` : ''}
        <div class="row"><button class="btn" data-take="${t.id}">אני לוקח את זה</button></div>
      </div>`).join('');
  }
  if (S.tab === 'mine') {
    if (!S.mine.length) return `<div class="empty">אין לך משימות כרגע.<br>משימה שתיקח תופיע כאן עם כל הפרטים.</div>`;
    return S.mine.map((t) => `
      <div class="card">
        ${routeHtml(t)} <span class="pill ${t.status}">${STATUS[t.status]}</span>
        ${fmtDue(t) ? `<div class="due">⏰ ${esc(fmtDue(t))}</div>` : ''}
        <div class="det">${contactsHtml(t, t.status === 'taken')}${t.details ? `<div style="margin-top:6px">${esc(t.details)}</div>` : ''}</div>
        ${t.status === 'taken' ? `<div class="row">
          <button class="btn ok" data-done="${t.id}">בוצע ✔</button>
          <button class="btn sec" data-release="${t.id}">לא יכול – להחזיר</button>
        </div>` : ''}
      </div>`).join('');
  }
  if (S.tab === 'manage') {
    const now = new Date(Date.now() + 60 * 60000);
    const pad = (n) => String(n).padStart(2, '0');
    const defDate = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    return `
      <div class="card">
        <h3 style="margin:0 0 4px">משימה חדשה</h3>
        <div class="hint">"מאיפה" ו"לאן" וזמן הביצוע יופיעו לכל המתנדבים. שאר הפרטים יופיעו רק למי שלוקח את המשימה.</div>
        <h4 style="margin:14px 0 0">מאיפה</h4>
        <div id="nFromList">${stopBlock('p', true)}</div>
        <button type="button" class="addln" id="addFrom">+ עוד כתובת איסוף</button>
        <h4 style="margin:10px 0 0">לאן</h4>
        <div id="nToList">${stopBlock('d', true)}</div>
        <button type="button" class="addln" id="addTo">+ עוד כתובת פיזור</button>
        <div class="split">
          <div><label>תאריך</label><input id="nDate" type="date" value="${defDate}"></div>
          <div><label>שעה</label><input id="nTime" type="time"></div>
        </div>
        <label>או זמן במילים (לא חובה)</label><input id="nDueText" placeholder="למשל: עד הצהריים">
        <label>פרטים נוספים</label><textarea id="nDet" placeholder="כתובת מלאה, קומה, מה לקחת וכו'"></textarea>
        <div class="err" id="nErr"></div>
        <div class="row"><button class="btn" id="nGo">פרסם ושלח התראה לכולם</button></div>
      </div>
      <h2>כל המשימות</h2>
      ${S.all.length ? S.all.map((t) => `
        <div class="card">
          ${routeHtml(t)} <span class="pill ${t.status}">${STATUS[t.status]}</span>
          ${fmtDue(t) ? `<div class="due">⏰ ${esc(fmtDue(t))}</div>` : ''}
          ${t.taken_name ? `<div class="meta">לקח: <b>${esc(t.taken_name)}</b> ${telLink(t.taken_phone)}</div>` : ''}
          <div class="det">${contactsHtml(t)}${t.details ? `<div style="margin-top:6px">${esc(t.details)}</div>` : ''}</div>
          ${['open', 'taken'].includes(t.status) ? `<div class="row">
            ${t.status === 'open' ? `<button class="btn sec sm" data-resend="${t.id}">שלח שוב התראה</button>` : ''}
            ${t.status === 'taken' ? `<button class="btn sec sm" data-mdone="${t.id}">סמן כבוצע</button><button class="btn sec sm" data-mrelease="${t.id}">החזר לפתוחות</button>` : ''}
            <button class="btn sec sm" data-cancel="${t.id}">בטל משימה</button>
          </div>` : ''}
        </div>`).join('') : '<div class="empty">עדיין אין משימות</div>'}`;
  }
  if (S.tab === 'users') {
    const sec = (title, list) => list.length ? `<h2>${title}</h2>` + list.map((u) => `
      <div class="card usr">
        <div class="nm">${esc(u.name)}${u.role === 'manager' ? ' <span class="pill">מנהל</span>' : ''}${u.has_push ? '' : ' <span class="pill">בלי התראות</span>'}${u.locked ? ' <span class="pill open">נעול</span>' : ''}<div class="meta">${telLink(u.phone)}</div></div>
        ${!u.approved && !u.blocked ? `<button class="btn ok sm" data-u="${u.id}" data-a="approve">אשר</button><button class="btn sec sm" data-u="${u.id}" data-a="block">דחה</button>` : ''}
        ${u.approved && u.id !== S.me.id ? `${u.role === 'manager' ? `<button class="btn sec sm" data-u="${u.id}" data-a="volunteer">בטל מנהל</button>` : `<button class="btn sec sm" data-u="${u.id}" data-a="manager">הפוך למנהל</button>`}<button class="btn sec sm" data-u="${u.id}" data-a="block">חסום</button>` : ''}
        ${u.blocked ? `<button class="btn sec sm" data-u="${u.id}" data-a="approve">החזר</button>` : ''}
        ${u.locked ? `<button class="btn sec sm" data-u="${u.id}" data-a="unlock">שחרר נעילה</button>` : ''}
      </div>`).join('') : '';
    const pend = S.users.filter((u) => !u.approved && !u.blocked);
    const act = S.users.filter((u) => u.approved);
    const blk = S.users.filter((u) => u.blocked);
    return (pend.length ? '' : '<div class="meta" style="margin:4px">אין מתנדבים שמחכים לאישור.</div>')
      + sec('מחכים לאישור', pend) + sec(`מתנדבים פעילים (${act.length})`, act) + sec('חסומים', blk)
      + `<div class="row" style="margin-top:20px"><button class="btn sec" id="testPush">שלח לי התראת בדיקה</button><button class="btn sec" id="out">יציאה מהחשבון</button></div>`;
  }
  return '';
}

function bind() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach((el) => el.onclick = () => fn(el));
  const act = async (el, job, okMsg) => { el.disabled = true; try { await job(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message); } await refresh(); };

  on('[data-take]', async (el) => {
    const t = S.open.find((x) => x.id == el.dataset.take);
    if (!await confirmBox('לקחת את המשימה?', `${routeHtml(t)}${fmtDue(t) ? `<div class="due">⏰ ${esc(fmtDue(t))}</div>` : ''}<div class="meta">אחרי שתיקח, המשימה תיסגר לשאר המתנדבים ותראה את כל הפרטים.</div>`, 'כן, אני לוקח')) return;
    el.disabled = true;
    try { await rpc('ezer_take_task', { p_token: S.token, p_task: t.id }); notify('taken', t.id); toast('המשימה שלך! הפרטים ב"המשימות שלי"'); S.tab = 'mine'; }
    catch (e) { toast(e.message); }
    await refresh();
  });
  on('[data-done]', async (el) => { if (await confirmBox('המשימה בוצעה?', 'תודה רבה! 🙏', 'כן, בוצע')) act(el, () => rpc('ezer_done_task', { p_token: S.token, p_task: +el.dataset.done }), 'תזכה למצוות! ✔'); });
  on('[data-release]', async (el) => { if (await confirmBox('להחזיר את המשימה?', 'המשימה תחזור להיות פתוחה לכל המתנדבים.', 'כן, להחזיר')) act(el, async () => { await rpc('ezer_release_task', { p_token: S.token, p_task: +el.dataset.release }); notify('task', +el.dataset.release); }, 'המשימה הוחזרה'); });
  on('[data-mdone]', (el) => act(el, () => rpc('ezer_done_task', { p_token: S.token, p_task: +el.dataset.mdone }), 'סומן כבוצע'));
  on('[data-mrelease]', async (el) => { if (await confirmBox('להחזיר לפתוחות?', 'המשימה תחזור לכל המתנדבים ותישלח שוב התראה.', 'כן')) act(el, async () => { await rpc('ezer_release_task', { p_token: S.token, p_task: +el.dataset.mrelease }); await notify('task', +el.dataset.mrelease); }, 'הוחזרה ונשלחה התראה'); });
  on('[data-resend]', (el) => act(el, async () => { const r = await notify('task', +el.dataset.resend); toast(`נשלחה התראה ל-${r.sent ?? 0} טלפונים`); }));
  on('[data-cancel]', async (el) => { if (await confirmBox('לבטל את המשימה?', 'המשימה תוסר מהרשימות.', 'כן, לבטל')) act(el, () => rpc('ezer_cancel_task', { p_token: S.token, p_task: +el.dataset.cancel }), 'המשימה בוטלה'); });
  on('[data-u]', async (el) => {
    const a = el.dataset.a, u = S.users.find((x) => x.id == el.dataset.u);
    const names = { approve: 'לאשר', block: 'לחסום', manager: 'להפוך למנהל', volunteer: 'לבטל הרשאת מנהל', unlock: 'לשחרר נעילה' };
    if (a !== 'approve' && a !== 'unlock' && !await confirmBox(`${names[a]} את ${u.name}?`, '', 'כן')) return;
    act(el, () => rpc('ezer_set_user', { p_token: S.token, p_user: u.id, p_action: a }), 'עודכן');
  });
  const ng = $('#nGo');
  const af = $('#addFrom'); if (af) af.onclick = () => $('#nFromList').insertAdjacentHTML('beforeend', stopBlock('p', false));
  const at = $('#addTo'); if (at) at.onclick = () => $('#nToList').insertAdjacentHTML('beforeend', stopBlock('d', false));
  const nc = $('#nFromList') && $('#nFromList').closest('.card');
  if (nc) nc.addEventListener('click', (e) => {
    if (e.target.closest('[data-addph]')) e.target.closest('.stop').querySelector('.sPhones').insertAdjacentHTML('beforeend', '<input class="sPhone" type="tel" inputmode="tel" style="margin-top:6px">');
    if (e.target.closest('[data-rmstop]')) e.target.closest('.stop').remove();
  });
  if (ng) ng.onclick = async () => {
    $('#nErr').textContent = '';
    const d = $('#nDate').value, tm = $('#nTime').value, dt = $('#nDueText').value.trim();
    const collect = (sel) => [...document.querySelectorAll(sel + ' .stop')].map((b) => ({
      place: b.querySelector('.sPlace').value.trim(), name: b.querySelector('.sName').value.trim(),
      phones: [...b.querySelectorAll('.sPhone')].map((i) => i.value.trim()).filter(Boolean) })).filter((x) => x.place);
    const pickups = collect('#nFromList'), drops = collect('#nToList');
    if (!pickups.length || !drops.length) { $('#nErr').textContent = 'צריך למלא לפחות כתובת איסוף אחת וכתובת פיזור אחת'; return; }
    if (!tm && !dt) { $('#nErr').textContent = 'צריך למלא שעה, או זמן במילים'; return; }
    const due = d && tm ? new Date(`${d}T${tm}`).toISOString() : null;
    ng.disabled = true;
    try {
      const id = await rpc('ezer_create_task_v2', { p_token: S.token, p_pickups: pickups, p_drops: drops, p_due_at: due,
        p_due_text: tm ? '' : dt, p_details: $('#nDet').value });
      const r = await notify('task', id);
      toast(`המשימה פורסמה ✔ נשלחה התראה ל-${r.sent ?? 0} טלפונים`);
    } catch (e) { $('#nErr').textContent = e.message; ng.disabled = false; return; }
    await refresh();
  };
  const tp = $('#testPush');
  if (tp) tp.onclick = async () => { const r = await notify('test'); toast(r.sent ? 'נשלחה התראת בדיקה' : 'אין התראות פעילות בטלפון הזה'); };
  const out = $('#out');
  if (out) out.onclick = async () => { if (await confirmBox('לצאת מהחשבון?', '', 'יציאה')) logout(); };
}

let busy = false;
async function refresh() {
  if (busy || !S.token) return; busy = true;
  try {
    S.me = await rpc('ezer_me', { p_token: S.token });
    if (S.me.approved) await load();
  } catch (e) {
    if (/לא מחובר/.test(e.message)) { logout(); busy = false; return; }
    toast(e.message);
  }
  busy = false;
  // keep typed text in the new-task form when auto refreshing
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest('main .card') && S.tab === 'manage') return;
  render();
}

async function start() {
  if (!S.token) return renderLogin();
  await checkPush();
  await refresh();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register("sw.js");
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data?.type === 'refresh') { const h = (e.data.url || '').split('#')[1]; if (h) S.tab = h; refresh(); } });
}
const h0 = location.hash.slice(1); if (h0) S.tab = h0;
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden && S.tab !== 'manage') refresh(); }, 30000);
start();
</script>
</body>
</html>
